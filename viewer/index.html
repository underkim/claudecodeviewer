<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claude Code Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <span class="status-dot connected" id="status-dot"></span>
      <h1>Claude Code Viewer</h1>
      <span id="status-text">ready</span>
    </header>

    <nav id="sidebar">
      <form id="new-session-form">
        <div class="form-title">New session</div>
        <div class="form-row">
          <input name="cwd" placeholder="Working directory (cwd)" required />
          <button type="button" id="browse-btn">Browse…</button>
        </div>
        <textarea name="prompt" placeholder="Initial prompt" rows="3" required></textarea>
        <div class="form-row">
          <input name="model" placeholder="model (optional)" />
          <select name="permissionMode">
            <option value="">permission: default</option>
            <option value="plan">plan</option>
            <option value="acceptEdits">acceptEdits</option>
            <option value="dontAsk">dontAsk</option>
            <option value="bypassPermissions">bypassPermissions</option>
          </select>
        </div>
        <button type="submit">Launch</button>
        <div id="new-session-error" class="form-error"></div>
      </form>

      <div id="discover-panel">
        <div class="form-title-row">
          <span class="form-title">Attach to a running session</span>
          <button type="button" id="discover-refresh-btn">Refresh</button>
        </div>
        <div id="discover-list"></div>
      </div>

      <div id="sessions"></div>
    </nav>

    <div id="timeline-wrap">
      <div id="dashboard"></div>

      <div id="detail-header" hidden>
        <button type="button" id="back-to-dashboard">← Dashboard</button>
        <span id="detail-title"></span>
      </div>
      <main id="timeline" hidden></main>
      <form id="composer" hidden>
        <input name="text" placeholder="Send a follow-up message to this session…" autocomplete="off" />
        <button type="submit">Send</button>
        <button type="button" id="stop-btn">Stop</button>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
