<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claude Code Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <span class="status-dot" id="status-dot"></span>
      <h1>Claude Code Viewer</h1>
      <span id="status-text">connecting…</span>
    </header>
    <nav id="sessions"></nav>
    <main id="timeline">
      <div id="empty-state">Select a session, or watch "All sessions" for live events as they arrive.</div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
