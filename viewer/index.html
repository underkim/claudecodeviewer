<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claude Code Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <span class="status-dot connected" id="status-dot"></span>
      <h1>Claude Code Viewer</h1>
      <span id="status-text">view-only</span>
      <button type="button" id="settings-btn" title="Global settings">⚙ Settings</button>
    </header>

    <nav id="sidebar">
      <div class="sidebar-title form-title">Sessions</div>
      <div id="sessions"></div>
    </nav>

    <div id="timeline-wrap">
      <div id="dashboard"></div>

      <div id="project-panel" hidden>
        <div class="project-panel-header">
          <button type="button" id="project-back-btn">← Dashboard</button>
          <div class="project-panel-title">
            <span id="project-title"></span>
            <span id="project-cwd-label"></span>
          </div>
        </div>
        <div class="project-panel-body">
          <section>
            <div class="section-title">Stats</div>
            <div id="project-stats" class="stat-grid"></div>
            <div id="project-tool-breakdown" class="tool-breakdown"></div>
          </section>
          <section>
            <div class="section-title">Roadmap</div>
            <div id="project-roadmap"></div>
          </section>
          <section>
            <div class="section-title">Sessions</div>
            <div id="project-sessions"></div>
          </section>
        </div>
      </div>

      <div id="settings-panel" hidden>
        <div class="settings-head">
          <span class="form-title">Global settings</span>
          <span id="settings-path"></span>
        </div>
        <textarea id="settings-editor" spellcheck="false"></textarea>
        <div class="settings-actions">
          <button type="button" id="settings-reload-btn">Reload</button>
          <button type="button" id="settings-save-btn">Save</button>
          <span id="settings-status"></span>
        </div>
      </div>

      <div id="detail-header" hidden>
        <button type="button" id="back-to-dashboard">← Dashboard</button>
        <span id="detail-title"></span>
      </div>
      <main id="timeline" hidden></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
